<body>

<div class="app" id="app">

  <aside class="side" id="side">

    <div class="side__top">
      <div class="brand" id="brand"></div>
      <button class="glyph" id="side-close" type="button"
              data-icon="panel" aria-label="Close sidebar"></button>
    </div>

    <div class="side__head">
      <button class="fresh" id="new-chat" type="button">
        <span class="fresh__ico" data-icon="plus"></span>
        <span>New chat</span>
      </button>

      <div class="find">
        <span class="find__ico" data-icon="find" aria-hidden="true"></span>
        <input id="find" type="search" placeholder="Search" aria-label="Search chats">
      </div>
    </div>

    <nav class="side__list" id="list" aria-label="Chats">
      <div id="chats"></div>
      <p class="side__none" id="no-chats" hidden></p>
    </nav>

    <div class="side__foot">
      <span class="pfp" id="pfp" aria-hidden="true"></span>
      <span class="side__who">
        <span class="side__user">eb1386</span>
        <span class="side__plan">Free Tier</span>
      </span>
    </div>
  </aside>

  <div class="veil" id="veil" aria-hidden="true"></div>

  <main class="main is-empty" id="main">

    <header class="bar">
      <button class="glyph" id="side-open" type="button"
              data-icon="panel" aria-label="Open sidebar"></button>

      <div class="bar__end">
        <span class="tempflag" id="tempflag" hidden>Temporary</span>
        <button class="glyph" id="temp-toggle" type="button" data-icon="temp"
                data-order="radial" aria-pressed="false" aria-label="Temporary chat"></button>
      </div>
    </header>

    <div class="scroll" id="scroll">
      <div class="hero" id="hero">
        <div class="hero__mark" id="hero-mark"></div>
        <h2 class="hero__ask" id="hero-ask">Where should we begin?</h2>
        <div class="slot" id="slot-hero"></div>
        <div class="tips" id="tips"></div>
      </div>
      <div class="thread" id="thread"></div>
    </div>

    <div class="slot slot--dock" id="slot-dock"></div>

  </main>
</div>

<!-- moves between the hero and the dock as the conversation starts -->
<form class="box" id="box" autocomplete="off">
  <div class="box__field">
    <textarea id="input" rows="1" placeholder="Ask 1386" aria-label="Message"></textarea>

    <div class="box__controls">
      <div class="pick" id="pick">
        <button class="pick__btn" id="pick-btn" type="button"
                aria-haspopup="listbox" aria-expanded="false" aria-label="Choose model">
          <span id="pick-name">Plasma</span>
          <span class="pick__chev" data-icon="chev" aria-hidden="true"></span>
        </button>
        <div class="pick__menu" id="pick-menu" role="listbox" hidden></div>
      </div>

      <button class="box__send" id="send" type="submit"
              data-icon="send" disabled aria-label="Send"></button>
    </div>
  </div>
  <p class="box__note" id="note"></p>
</form>

<script src="/static/prompts.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
