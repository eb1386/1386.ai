model:
  vocab_size: 48000
  hidden_size: 1280
  num_layers: 26
  num_heads: 20
  num_kv_heads: 4
  intermediate_size: 3584
  max_seq_len: 1024
  dropout: 0.0
  rope_theta: 10000.0
training:
  batch_size: 32
  micro_batch_size: 4
  gradient_accumulation: 8
  max_steps: 1500
  warmup_steps: 100
  learning_rate: 0.0003
  min_lr: 3.0e-05
  weight_decay: 0.1
  max_grad_norm: 1.0
  precision: bf16
  gradient_checkpointing: true
  compile: false
  depth_scaled_init: false
  optimizer: adamw
  checkpoint_interval: 1000000000
  keep_last_checkpoints: 0
  eval_interval: 500
  log_interval: 50
  val_sequences: 2048
  val_batch_size: 8
  checkpoint_prefix: abl_lr_sweep_1
data:
  shard_dir: data/shards_1.1_v2
  tokenizer_path: data/tokenizer_1.1.model
  seq_len: 1024
