# FINAL 2k steps of the cooldown, compile DISABLED.
# torch.compile autotunes on the GPU at startup; resuming while the GPU was busy
# (a game) made it hang for 50 min. compile only pays off over long runs -- for
# the last 2,000 steps eager is both safer and effectively as fast.
model:
  vocab_size: 48000
  hidden_size: 1280
  num_layers: 26
  num_heads: 20
  num_kv_heads: 4
  intermediate_size: 3584
  max_seq_len: 1024
  dropout: 0.0
  rope_theta: 10000.0
training:
  batch_size: 32
  micro_batch_size: 4
  gradient_accumulation: 8
  max_steps: 326000
  warmup_steps: 2000
  learning_rate: 0.0006
  min_lr: 0.0
  lr_schedule: wsd
  decay_shape: 1-sqrt
  weight_decay: 0.1
  max_grad_norm: 1.0
  betas:
  - 0.9
  - 0.95
  optimizer: adamw
  precision: bf16
  gradient_checkpointing: true
  compile: false
  depth_scaled_init: false
  checkpoint_interval: 2000
  keep_last_checkpoints: 4
  eval_interval: 2000
  log_interval: 50
  val_sequences: 2048
  val_batch_size: 8
  checkpoint_prefix: 1.1_v3_step
  decay_steps: 46000
data:
  shard_dir: data/shards_anneal
  tokenizer_path: data/tokenizer_1.1.model
  seq_len: 1024
