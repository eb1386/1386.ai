# plasma 1.1 finetune -- v3 recipe
#
# data: data/sft_shards_1.1_v3 -- real public instruct data only, decontaminated
#       against the benchmark, WHOLE-CONVERSATION bin packing (no attention across
#       unrelated examples), assistant-only loss, EOS taught.
# base: checkpoints/pretrain_1.1_v3_final.pt (passed via --finetune)
# lr:   2e-5. 1e-5 (v2) is at the very bottom of the usual 1e-5..5e-5 SFT band for
#       a model this size; 2e-5 is the common default for ~0.5B.
model:
  vocab_size: 48000
  hidden_size: 1280
  num_layers: 26
  num_heads: 20
  num_kv_heads: 4
  intermediate_size: 3584
  max_seq_len: 1024
  dropout: 0.0
  rope_theta: 10000.0

training:
  batch_size: 32
  micro_batch_size: 4
  gradient_accumulation: 8
  # 151,773 train seqs / 32 per step = 4,743 steps/epoch; 14,200 ~= 3 epochs
  max_steps: 14200
  warmup_steps: 400
  learning_rate: 2.0e-5
  min_lr: 0.0
  lr_schedule: cosine
  weight_decay: 0.05
  max_grad_norm: 1.0
  betas: [0.9, 0.95]
  optimizer: adamw
  precision: bf16
  gradient_checkpointing: true
  compile: false
  use_loss_mask: true
  checkpoint_interval: 2000
  keep_last_checkpoints: 4
  eval_interval: 1000
  log_interval: 50
  val_sequences: 1024
  val_batch_size: 8
  checkpoint_prefix: 1.1_v3_ft_step

data:
  shard_dir: data/sft_shards_1.1_v3
  tokenizer_path: data/tokenizer_1.1.model
  seq_len: 1024
