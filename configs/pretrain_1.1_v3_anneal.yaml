# plasma 1.1 -- ANNEAL + COOLDOWN phase (steps 280,000 -> 326,000)
#
# WHY EARLY: standard benchmarks were measured FLAT over 125k steps of constant LR
# (avg 0.452 @135k -> 0.458 @210k -> 0.450 @260k, all inside n=100 noise) while
# val_ppl drifted up slightly. more constant-LR training was not buying anything,
# so the remaining budget is better spent on the cooldown (where WSD converts
# accumulated learning into measurable gains) and then on SFT.
#
# TWO changes at once, deliberately:
#   1. data  -> data/shards_anneal (math 25% / code 20% / cosmopedia 15% /
#      fineweb_edu 30% / stackexchange 10%) -- upweights the knowledge-dense slices
#   2. LR    -> (1-sqrt) cooldown from 6e-4 to 0 over these 46k steps
# val_0000.bin in shards_anneal is a COPY of the main val set, so val_ppl stays
# comparable across the switch.
#
# RUN:
#   python -m src.train.train --config configs/pretrain_1.1_v3_anneal.yaml #     --resume checkpoints/1.1_v3_step_280000.pt --log-path logs/pretrain_v3.jsonl
model:
  vocab_size: 48000
  hidden_size: 1280
  num_layers: 26
  num_heads: 20
  num_kv_heads: 4
  intermediate_size: 3584
  max_seq_len: 1024
  dropout: 0.0
  rope_theta: 10000.0
training:
  batch_size: 32
  micro_batch_size: 4
  gradient_accumulation: 8
  max_steps: 326000
  warmup_steps: 2000
  learning_rate: 0.0006
  min_lr: 0.0
  lr_schedule: wsd
  decay_shape: 1-sqrt
  weight_decay: 0.1
  max_grad_norm: 1.0
  betas:
  - 0.9
  - 0.95
  optimizer: adamw
  precision: bf16
  gradient_checkpointing: true
  compile: true
  depth_scaled_init: false
  checkpoint_interval: 2000
  keep_last_checkpoints: 4
  eval_interval: 2000
  log_interval: 50
  val_sequences: 2048
  val_batch_size: 8
  checkpoint_prefix: 1.1_v3_step
  decay_steps: 46000
data:
  shard_dir: data/shards_anneal
  tokenizer_path: data/tokenizer_1.1.model
  seq_len: 1024
