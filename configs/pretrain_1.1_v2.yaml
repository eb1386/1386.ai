# plasma 1.1 pretrain (clean rebuild v2)
# corpus: data/shards_1.1_v2 (fineweb+wiki+code+stackexchange+arxiv, no upsampling,
# no 1.0 recycling, no instruct contamination, document-level val split)
model:
  vocab_size: 48000
  hidden_size: 1280
  num_layers: 26
  num_heads: 20
  num_kv_heads: 4
  intermediate_size: 3584
  max_seq_len: 1024
  dropout: 0.0
  rope_theta: 10000.0

training:
  batch_size: 32
  micro_batch_size: 2
  gradient_accumulation: 16
  # ~7B unique tokens; ~1.5 epochs ~= 10.5B tokens seen (~Chinchilla for 521M).
  # finalized against actual corpus size after the build.
  max_steps: 320000
  warmup_steps: 3000
  learning_rate: 1.2e-4
  min_lr: 1.2e-5
  weight_decay: 0.1
  max_grad_norm: 1.0
  precision: bf16
  gradient_checkpointing: true
  checkpoint_interval: 5000
  eval_interval: 5000
  log_interval: 50
  keep_last_checkpoints: 4
  checkpoint_prefix: 1.1_v2_step

data:
  shard_dir: data/shards_1.1_v2
  tokenizer_path: data/tokenizer_1.1.model
  seq_len: 1024
