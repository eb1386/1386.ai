# plasma 1.1 pretrain -- v3 recipe
#
# corpus:  data/shards_1.1_v3 (fineweb 40 / code 16 / math 10 /
#          stackexchange 10 / cosmopedia 8 / wiki 10 / arxiv 6, sources epoched so the
#          mixture holds for the WHOLE run -- verified: code stays 21-28% from shard 0
#          through shard 145, where v2 collapsed 21% -> 3%. v2 ended on ~pure web.)
# lr:      6e-4, chosen by controlled ablation (1500 steps, identical data/seed):
#            1.2e-4 -> val 4.727   (what v2 used: ~5x too low)
#            3e-4   -> val 4.207
#            6e-4   -> val 4.083   <-- best
#          decaying to ZERO (min_lr 0) is worth ~1% final loss over a 10% floor.
# schedule: WSD (warmup-stable-decay). constant lr through the bulk, (1-sqrt)
#          cooldown over the last 10%. this means the run length does NOT have to
#          be committed up front -- it can be cooled down early or extended.
model:
  vocab_size: 48000
  hidden_size: 1280
  num_layers: 26
  num_heads: 20
  num_kv_heads: 4
  intermediate_size: 3584
  max_seq_len: 1024
  dropout: 0.0
  rope_theta: 10000.0

training:
  batch_size: 32
  micro_batch_size: 4
  gradient_accumulation: 8
  # 460,000 x 32,768 = 15.1B tokens ~= 1 epoch of the corpus, ~12.5 days at 13.9k tok/s
  max_steps: 460000
  warmup_steps: 2000
  learning_rate: 6.0e-4
  min_lr: 0.0
  lr_schedule: wsd
  decay_frac: 0.1
  decay_shape: 1-sqrt
  weight_decay: 0.1
  max_grad_norm: 1.0
  betas: [0.9, 0.95]
  optimizer: adamw
  precision: bf16
  gradient_checkpointing: true
  compile: true    # measured 1.24x on a quiet box (16,708 vs 13,475 tok/s), 31s one-time cost
  depth_scaled_init: false
  checkpoint_interval: 5000
  keep_last_checkpoints: 4
  eval_interval: 5000
  log_interval: 50
  val_sequences: 2048
  val_batch_size: 8
  checkpoint_prefix: 1.1_v3_step

data:
  shard_dir: data/shards_1.1_v3
  tokenizer_path: data/tokenizer_1.1.model
  seq_len: 1024
