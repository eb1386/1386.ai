# plasma 1.1 focused repair SFT
model:
  vocab_size: 48000
  hidden_size: 1280
  num_layers: 26
  num_heads: 20
  num_kv_heads: 4
  intermediate_size: 3584
  max_seq_len: 1024
  dropout: 0.0
  rope_theta: 10000.0

training:
  batch_size: 8
  micro_batch_size: 2
  gradient_accumulation: 4
  max_steps: 1500
  warmup_steps: 100
  learning_rate: 2.0e-6
  min_lr: 2.0e-7
  weight_decay: 0.0
  max_grad_norm: 0.5
  precision: bf16
  gradient_checkpointing: true
  checkpoint_interval: 500
  eval_interval: 250
  log_interval: 50
  use_loss_mask: true
  checkpoint_prefix: 1.1_focus_ft_step

data:
  shard_dir: data/focus_shards_1.1
  tokenizer_path: data/tokenizer_1.1.model
  seq_len: 1024
