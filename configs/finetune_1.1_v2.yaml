# plasma 1.1 finetune (clean rebuild v2)
# sft: data/sft_shards_1.1_v2 (real public instruct data, decontaminated, assistant-masked)
# base: checkpoints/pretrain_1.1_v2_final.pt (via --finetune)
model:
  vocab_size: 48000
  hidden_size: 1280
  num_layers: 26
  num_heads: 20
  num_kv_heads: 4
  intermediate_size: 3584
  max_seq_len: 1024
  dropout: 0.0
  rope_theta: 10000.0

training:
  batch_size: 32
  micro_batch_size: 2
  gradient_accumulation: 16
  # 168,539 train seqs / eff batch 32 = ~5,270 steps/epoch; 16000 ~= 3 epochs.
  max_steps: 16000
  warmup_steps: 500
  learning_rate: 1.0e-5
  min_lr: 1.0e-6
  weight_decay: 0.05
  max_grad_norm: 0.5
  precision: bf16
  gradient_checkpointing: true
  checkpoint_interval: 2000
  eval_interval: 1000
  log_interval: 50
  keep_last_checkpoints: 3
  use_loss_mask: true
  checkpoint_prefix: 1.1_v2_ft_step

data:
  shard_dir: data/sft_shards_1.1_v2
  tokenizer_path: data/tokenizer_1.1.model
  seq_len: 1024
