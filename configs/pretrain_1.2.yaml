# plasma 1.2 pretrain -- 756M dense, 30B tokens, seq 2048
#
# shape: audit candidate A. exact params 756,438,528 with tied embeddings
# (verify: model.count_parameters() at launch; config.param_count_estimate
# now counts the tied embedding once).
#
# vs 1.1: +qk_norm (attention-logit stability; olmo-2/gemma-2), rope_theta
# 100000 (2048 ctx + later extension headroom), z_loss 1e-4 (logit drift
# guard over a ~1M-step run), adamw8bit (fp32 adam states alone would be
# 5.6GB; 8-bit fits 16GB with mb2 activation headroom).
#
# schedule: wsd, peak 5.0e-4 (1/width transfer from 1.1's stable 6e-4 at
# h1280 -> h1536), stable through 90%, 1-sqrt cooldown over the last 10%
# on the anneal mix (swap shard_dir at step ~823k, same as the 1.1 recipe).
#
# honest wall-clock at measured 1.1 throughput scaled by flops: 28-36 days.
# wsd means an early cooldown at ANY point yields a usable model -- e.g.
# stopping at 20B tokens (~3 weeks) only forfeits the last few points.
model:
  vocab_size: 48000
  hidden_size: 1536
  num_layers: 28
  num_heads: 24
  num_kv_heads: 4
  intermediate_size: 4096
  max_seq_len: 2048
  dropout: 0.0
  rope_theta: 100000.0
  qk_norm: true

training:
  batch_size: 16
  micro_batch_size: 2
  gradient_accumulation: 8
  # 30e9 tokens / (2 * 2048 * 8) = 915,527 steps
  max_steps: 915000
  warmup_steps: 2000
  learning_rate: 5.0e-4
  min_lr: 0.0
  lr_schedule: wsd
  decay_frac: 0.10
  decay_shape: 1-sqrt
  weight_decay: 0.1
  max_grad_norm: 1.0
  betas: [0.9, 0.95]
  optimizer: adamw8bit
  z_loss: 1.0e-4
  precision: bf16
  gradient_checkpointing: true
  compile: true
  use_loss_mask: false
  checkpoint_interval: 4000
  keep_last_checkpoints: 4
  eval_interval: 4000
  log_interval: 50
  val_sequences: 2048
  val_batch_size: 4
  checkpoint_prefix: 1.2_step

data:
  shard_dir: data/shards_1.2
  tokenizer_path: data/tokenizer_1.2.model
  seq_len: 2048
